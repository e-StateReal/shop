# Site Configuration
title: e-State Real Store
description: Your premier real estate affiliate platform for discovering curated properties and real estate resources.
author: e-State Real Store
email: contact@estatereal.com
url: "https://e-statereal.github.io"
baseurl: "/shop"

# Collections Configuration
collections:
  pages:
    output: true
    permalink: /:collection/:name/

# Navigation Configuration
navigation:
  education:
    - title: "Get Started"
      url: "/pages/get-started.html"
      icon: "fas fa-rocket"
    - title: "Enroll Now"
      url: "/pages/enroll.html"
      icon: "fas fa-user-plus"
    - title: "Register"
      url: "/pages/register.html"
      icon: "fas fa-user-edit"
  properties:
    - title: "Contact Agent"
      url: "/pages/contact.html"
      icon: "fas fa-phone"
    - title: "Schedule Visit"
      url: "/pages/schedule.html"
      icon: "fas fa-calendar-alt"


# Email Configuration
email_config:
  from: "noreply@estatereal.com"
  to: "contact@estatereal.com"
  subject_prefix: "[e-State Real Store]"

# Theme Configuration
theme: jekyll-theme-minimal
remote_theme: pages-themes/minimal@v0.2.0

# SEO and Meta Tags
lang: en
encoding: utf-8
highlighter: rouge
permalink: pretty

# Social Media and Contact
social:
  name: e-State Real Store
  links:
    - https://instagram.com/e_state_real
    - https://facebook.com/people/E-State-Real/61554225206699/
    - https://linkedin.com/in/e-StateReal
    - https://x.com/e_state_real
    - https://www.tiktok.com/@estate.real

# Plugins and Extensions (GitHub Pages compatible)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude files from processing
exclude:
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - README.md
  - package.json
  - package-lock.json
  - src/
  - scripts/
  - _config.dev.yml
  - DEVELOPMENT.md

# Include files that should be processed
include:
  - _posts
  - assets
  - images
  - assets/data/db.jsonl

# Timezone
timezone: America/New_York

# Future posts
future: false

# Show drafts
show_drafts: false

# Keep files
keep_files: [assets, images, _config.yml]

# Markdown settings
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass settings
sass:
  style: compressed
  load_paths:
    - _sass
